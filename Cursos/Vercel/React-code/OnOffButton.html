<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>React JSX</title>
</head>
<body>
  <div id="app"></div>

  <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <script type="text/jsx">
    const app = document.getElementById("app");
    const root = ReactDOM.createRoot(app);

    function Home() {
      const [press,setPress] = React.useState(true)
      function handleClick() {
         setPress(prev => !prev) // Estado prev de anterior / pegue o antereior e nege ele ou seja troque.
      }
      return(
         <button onClick={handleClick}> Press Me ({press.toString()}) </button>
      )
    }

    root.render(<Home />);
  </script>
</body>
</html>
